}
nav.tabs button{

.view.on{display:block; animation:fade .18s ease;}

details{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin:8px 0; box-shadow:var(--shadow); overflow:hidden;}

details summary::-webkit-details-marker{display:none;}
details summary::after{content:"›"; margin-left:auto; font-size:20px; color:var(--ink3); transform:rotate(90deg); transition:transform .15s;}
details[open] summary::after{transform:rotate(-90deg);}
details .inner{padding:0 16px 14px;}
details.mini{box-shadow:none; background:var(--bg);}
.btn{display:inline-block; background:var(--blue); color:#fff; border:none; border-radius:12px; padding:10px 16px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;}
.btn.sub{background:var(--blue-soft); color:var(--blue);}

input[type=text],input[type=number],select{
  font-family:inherit; font-size:16px; color:var(--ink);

input:focus,select:focus{outline:2px solid var(--blue2); border-color:transparent;}

.wxrow .d{font-weight:700;}
.wxrow .ic{font-size:22px; text-align:center;}

.act{padding:10px 0; border-bottom:1px solid var(--line);}
.act:last-child{border-bottom:none;}
.act .nm{font-weight:700; font-size:15.5px;}
.act .meta{font-size:13px; color:var(--ink2); margin-top:2px;}
.act .why{font-size:14px; margin-top:3px;}

.checkrow:last-child{border-bottom:none;}

.checkrow.done label{text-decoration:line-through; color:var(--ink3);}
.checkrow label{flex:1;}
.daylist .card{display:block; padding:11px 14px;}
.daylist .dt{font-weight:800; color:var(--blue); font-size:13px;}
.daylist .ti{font-weight:700; margin-top:1px;}
.daylist .sb{font-size:13px; color:var(--ink2); margin-top:1px;}

.stgrid .nm{font-weight:800; margin-top:2px;}

.rslegend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:2px}
.qbtn{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer}

@keyframes cfFall{to{transform:translateY(108vh) rotate(340deg);opacity:.9}}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:88vw;text-align:center}

.stamp{position:absolute;top:8px;right:8px;background:var(--yellow-soft);color:#7D600E;border:1.5px solid var(--yellow);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;transform:rotate(8deg)}

.qbtn.big{font-size:18px;padding:13px 14px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

async function getWx(stKey){
  const st=ST[stKey]; const cache=load("sw26_wx",{});

    const r=await fetch(u); if(!r.ok) throw 0;
    const j=await r.json();
    if(!j.daily||!j.daily.time) throw 0;
    cache[stKey]={t:Date.now(),data:j.daily}; store("sw26_wx",cache);

}
async function getSea(){

  try{

function wxRows(daily,fromS,toS,max){
  if(!daily) return '<div class="skel">Keine Wetterdaten – zuletzt geladene Werte fehlen. Kurz online gehen und neu laden.</div>';
  let out=""; let n=0;
  for(let i=0;i<daily.time.length;i++){
    const t=daily.time[i];
    if(fromS && t<fromS) continue; if(toS && t>toS) continue; if(max && n>=max) break;
    const [ic,lb]=WCODE(daily.weather_code[i]);
    const rain=daily.precipitation_probability_max[i];
    out+=`<div class="wxrow"><span class="d">${fmtShort(t)}</span><span class="ic">${ic}</span>
      <span>${lb}${rain>=30?` · <span class="rain">☔ ${rain} %</span>`:""}</span>
      <span class="tt">${Math.round(daily.temperature_2m_max[i])}° <span class="lo">/ ${Math.round(daily.temperature_2m_min[i])}°</span></span></div>`;
    n++;
  }
  return out||'<div class="skel">Für diese Tage gibt es noch keine Prognose (max. 16 Tage im Voraus).</div>';
}

}

function packSumInit(){
  const stp=load("sw26_pack",{});let tot=0,done=0;
  Object.entries(PACK).forEach(([c,items])=>items.forEach(it=>{tot++;if(stp[c+"|"+it])done++;}));
  const px=load("sw26_packx",[]);px.forEach(i=>{tot++;if(i.d)done++;});
  packParty=(tot>0&&done===tot);
  const sum=document.getElementById("packSum");
  if(sum) sum.innerHTML=packParty?"🧳 Alles gepackt – Schweden kann kommen! 🇸🇪":`Noch <b>${tot-done}</b> von ${tot} offen`;
}

function hitBingo(i,el){
  const who=load("sw26_bingoWho","nora");
  const key="sw26_bingo_"+who;
  const bs=load(key,{c:{},l:0});
  bs.c[i]=!bs.c[i];
  el.classList.toggle("hit",bs.c[i]); el.setAttribute("aria-pressed",bs.c[i]?"true":"false");
  const lines=BLINES.filter(L=>L.every(j=>bs.c[j])).length;
  const full=BINGO.every((_,j)=>bs.c[j]);
  const win=document.getElementById("bingoWin");
  if(full&&bs.l<99){bs.l=99;if(win)win.innerHTML='<div class="oknote">🏆 SUPER-BINGO! Ganze Karte voll – das gibt ein Eis für alle!</div>';confetti(30);}
  else if(!full&&lines>(bs.l===99?0:bs.l)){bs.l=lines;if(win)win.innerHTML='<div class="oknote">🎉 BINGO – eine ganze Reihe! Weiter zur Super-Karte?</div>';confetti(16);}
  else if(!full){bs.l=lines;if(win&&lines===0)win.innerHTML="";}
  store(key,bs);
}

function elk(who,d){
  if(d<0&&!confirm("Einen Elch bei "+(who==="nora"?"Nora":"Karl")+" abziehen?")) return;
  const e=load("sw26_elk",{nora:0,karl:0});
  e[who]=Math.max(0,e[who]+d);store("sw26_elk",e);
  document.getElementById(who==="nora"?"elkNora":"elkKarl").textContent=e[who];
  const sum=e.nora+e.karl;
  const se=document.getElementById("elkSum"); if(se)se.textContent=sum;
  if(d>0){
    const M={1:"🫎 Der erste Elch – premiärälg!",5:"⭐ 5 Elche – älgspanare!",10:"👑 10 Elche – älgmästare!",25:"🏆 25 Elche – älgkung!"};
    if(M[e[who]]){showToast((who==="nora"?"Nora: ":"Karl: ")+M[e[who]]);if(e[who]>=10)confetti(14);}

    if(en&&sum>=10&&!en.innerHTML)en.innerHTML='<div class="oknote">🎉 10+ Elche als Team – das gibt Kanelbullar bei der nächsten Fika!</div>';
  }
}
function showToast(msg){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.textContent=msg;t.classList.add("on");
  clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove("on"),3000);
}
function confetti(n){
  try{
    if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const em=["🎉","⭐","🫎","🇸🇪","🟡"];
    for(let i=0;i<(n||24);i++){
      const sp=document.createElement("span");sp.className="cf";sp.textContent=em[i%em.length];
      sp.style.left=Math.random()*100+"vw";sp.style.animationDelay=(Math.random()*0.7)+"s";sp.style.fontSize=(15+Math.random()*15)+"px";
      document.body.appendChild(sp);setTimeout(()=>sp.remove(),3400);
    }
    if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate([80,40,80]);
  }catch(e){}
};

function nextFact(first){
  if(!factState.order.length||factState.pos>=factState.order.length) factShuffle();

async function getWxH(key){

    const u=`https://api.open-meteo.com/v1/forecast?latitude=${st.lat}&longitude=${st.lon}&hourly=precipitation_probability,precipitation&timezone=Europe%2FBerlin&forecast_days=2`;
    const r=await fetch(u); if(!r.ok) throw 0;
    const j=await r.json(); if(!j.hourly||!j.hourly.time) throw 0;

    return j.hourly;
  }catch(e){ return c?c.data:null; }
}

  const bars=idx.map(i=>{
    const p=hh.precipitation_probability[i]||0;
    const hr=parseInt(hh.time[i].slice(11,13),10);
    if(p>=45){rainy++; if(firstRain===null)firstRain=hr;}
    const hgt=Math.max(2,Math.round(p*0.38));
    return `<span><i style="height:${hgt}px;${p>=45?"":"background:var(--line);"}opacity:${p>=45?1:.6}"></i><b>${hr%3===0?hr:""}</b></span>`;
  }).join("");
  let sum;
  if(!rainy) sum="Tagsüber voraussichtlich trocken";
  else if(firstRain<=9&&rainy>=8) sum="Immer wieder Regen – Indoor-Plan bereithalten";
  else if(firstRain<=9) sum="Früh nass, später besser – Blick auf die Balken";
  else sum=`Regen ab ca. ${firstRain} Uhr möglich – Programm davor legen`;
  return `<div class="tiny" style="margin-top:10px"><b>☔ ${sum}</b></div><div class="rs">${bars}</div><div class="rslegend"><span>7 Uhr</span><span>Regenrisiko pro Stunde</span><span>22 Uhr</span></div>`;
}
async function getWarnings(key){
  const cache=load("sw26_warn",{}); const c=cache[key];
  if(c && Date.now()-c.t<3600e3) return c.v;
  let v=null;
  try{
    if(COUNTY[key]){
      const r=await fetch("https://opendata-download-warnings.smhi.se/ibww/api/version/1/warning.json");
      if(!r.ok) throw 0;
      const j=await r.json(); v=[];
      (j||[]).forEach(w=>{(w.warningAreas||[]).forEach(a=>{
        const lvl=a.warningLevel&&a.warningLevel.code;
        if(!["YELLOW","ORANGE","RED"].includes(lvl)) return;
        if(!(a.affectedAreas||[]).some(x=>(x.sv||"").includes(COUNTY[key]))) return;
        if(a.approximateEnd && new Date(a.approximateEnd)<new Date()) return;
        v.push({ev:(w.event&&(w.event.sv||w.event.en))||"Varning",lvl:lvl,txt:(a.eventDescription&&(a.eventDescription.sv||""))||""});
      });});
    } else if(DWDK[key]){
      const r=await fetch("https://www.dwd.de/DWD/warnungen/warnapp/json/warnings.json");
      if(!r.ok) throw 0;
      const raw=await r.text();
      const j=JSON.parse(raw.substring(raw.indexOf("(")+1,raw.lastIndexOf(")")));
      const all=[]; Object.values(j.warnings||{}).forEach(arr=>(arr||[]).forEach(w=>all.push(w)));
      Object.keys(DWDK).forEach(k2=>{
        let vv=[];
        all.forEach(w=>{
          if((w.level||0)<2) return;
          if(!DWDK[k2].some(kw=>(w.regionName||"").includes(kw))) return;
          vv.push({ev:w.event||"Warnung",lvl:w.level>=4?"RED":w.level===3?"ORANGE":"YELLOW",txt:""});
        });
        const seen=new Set(); vv=vv.filter(w=>!seen.has(w.ev)&&seen.add(w.ev));
        cache[k2]={t:Date.now(),v:vv};
      });
      store("sw26_warn",cache);
      return cache[key].v;
    }
  }catch(e){ v=c?c.v:null; }
  if(v!==null){cache[key]={t:Date.now(),v:v}; store("sw26_warn",cache);}
  return v;
}
async function warnHtml(key){
  if(key==="kopenhagen") return '<div class="tiny" style="margin-top:6px">Amtliche Warnungen Dänemark: <a href="https://www.dmi.dk/varsler" target="_blank" rel="noopener">dmi.dk</a></div>';
  if(!COUNTY[key]&&!DWDK[key]) return "";
  const v=await getWarnings(key);
  if(v===null) return "";
  if(!v.length) return '<div class="tiny" style="margin-top:6px">✅ Keine amtlichen Unwetterwarnungen</div>';
  return v.slice(0,3).map(w=>`<div class="${w.lvl==="YELLOW"?"note":"warn"}">⚠️ <b>${esc(w.ev)}</b>${w.txt?" – "+esc(w.txt):""} <span class="tiny">(${w.lvl==="YELLOW"?"gelbe":w.lvl==="ORANGE"?"orange":"rote"} Warnstufe)</span></div>`).join("");
}
async function getBath(){
  const c=load("sw26_bath",null);
  if(c && Date.now()-c.t<6*3600e3) return c.v;
  try{
    const r=await fetch("https://badplatsen.havochvatten.se/badplatsen/api/detail/SE0A11382000002849");
    if(!r.ok) throw 0;
    const j=await r.json();
    const v={cls:j.classificationText,algal:j.algalText,temp:j.sampleTemperature,val:j.sampleValue,date:j.sampleDate};
    store("sw26_bath",{t:Date.now(),v:v}); return v;
  }catch(e){ return c?c.v:null; }
}

async function fillTomorrow(t){
  const el=document.getElementById("hTomorrow"); if(!el) return;
  if(new Date().getHours()<18) return;
  const tm=iso(new Date(d2(t).getTime()+86400000));
  const day=dayFor(tm); if(!day) return;
  let h=`<div class="card blue"><h3>🌙 Blick auf morgen: ${day.ti}</h3>`;
  if(day.type==="drive") h+=`<p class="muted"><b>${day.drive.dep}</b> · ${day.drive.km} km (${day.drive.hrs})</p>`;
  if(day.ferry) h+=`<p class="muted">⛴️ ${day.ferry.n} – Abfahrt ${day.ferry.dep}</p>`;
  const prep=day.ferry?["Auto heute Abend packen & tanken","Frühstück und Jause fürs Auto vorrichten","Wecker stellen – Check-in nicht verpassen"]:day.type==="drive"?["Trinkflaschen füllen, Snackbox richten","Hörspiele und Tablets laden","Kühlschrank-Reste = morgen Picknick"]:[];
  if(prep.length) h+=`<p>`+prep.map(p=>"• "+p).join("<br>")+`</p>`;
  h+=`<div id="tmWx"></div></div>`;
  el.innerHTML=h;
  const daily=await getWx(day.st);
  const w=document.getElementById("tmWx");
  if(w&&daily) w.innerHTML=wxRows(daily,tm,tm,1);
}

    const note=(document.getElementById("parkNote")||{value:""}).value||"";
    store("sw26_park",{lat:pos.coords.latitude.toFixed(6),lon:pos.coords.longitude.toFixed(6),t:Date.now(),note:note.trim()});

}

function shareToday(){
  const t=todayISO(); const day=dayFor(t);
  let txt;
  if(!day){txt="Schweden 2026 – bald geht's los! 🇸🇪";}
  else{
    txt=fmtD(t)+" – "+day.ti+"\n";
    if(day.type==="drive") txt+="🚗 "+day.drive.from+" → "+day.drive.to+", "+day.drive.km+" km ("+day.drive.hrs+")\n";
    if(day.ferry) txt+="⛴️ "+day.ferry.n+", Abfahrt "+day.ferry.dep+"\n";
    (day.prog||[]).slice(0,5).forEach(p=>{txt+="• "+p.replace(/<[^>]*>/g,"")+"\n";});
    const cache=load("sw26_wx",{}); const c=cache[day.st];
    if(c&&c.data){const i=c.data.time.indexOf(t); if(i>=0) txt+="🌦️ "+WCODE(c.data.weather_code[i])[1]+", "+Math.round(c.data.temperature_2m_max[i])+"°/"+Math.round(c.data.temperature_2m_min[i])+"°\n";}
    txt+="– aus unserer Schweden-App 🇸🇪";
  }
  if(navigator.share){navigator.share({title:"Schweden 2026",text:txt}).catch(()=>{});}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>alert("Tagesplan kopiert – einfach irgendwo einfügen!"));}
  else alert(txt);
}
let qz=null;
function startQuiz(set){
  qz={set:set,idx:0,score:0,order:QUIZ[set].map((_,i)=>i).sort(()=>Math.random()-0.5).slice(0,8)};
  renderQuiz();
}
function renderQuiz(){
  const el=document.getElementById("quizBox"); if(!el||!qz) return;
  if(qz.idx>=qz.order.length){
    const n=qz.order.length;
    const qb=load("sw26_quizbest",{});
    let extra="";
    if(qz.score>(qb[qz.set]||0)){qb[qz.set]=qz.score;store("sw26_quizbest",qb);extra+='<div class="oknote">🏅 Neuer Rekord!</div>';confetti(14);}
    if(qz.score===n){extra+='<div class="oknote">👑 Quiz-König:in der Rückbank – fehlerfrei!</div>';confetti(24);}
    el.innerHTML=`<div class="oknote">🏁 Fertig! <b>${qz.score} von ${n}</b> richtig${qz.score>=n*0.7&&qz.score<n?" – stark!":""}</div>${extra}<button class="btn sub sm" onclick="startQuiz('${qz.set}')">Noch eine Runde (neue Fragen)</button>`;
    const qbEl=document.getElementById("quizBest");
    if(qbEl) qbEl.innerHTML=["mini","kinder","erwachsene"].filter(k=>qb[k]).map(k=>"🏅 "+({mini:"Mini",kinder:"Kinder",erwachsene:"Erwachsene"})[k]+": "+qb[k]+"/8").join(" · ");
    return;
  }
  const q=QUIZ[qz.set][qz.order[qz.idx]];
  el.innerHTML=`<p class="tiny">Frage ${qz.idx+1} von ${qz.order.length} · Punkte: ${qz.score}</p><p><b>${q.q}</b></p>`+q.a.map((a,i)=>`<button class="qbtn${qz.set==="mini"?" big":""}" onclick="answerQuiz(${i})">${a}</button>`).join("")+`<div id="quizFb"></div>`;
}
function answerQuiz(i){
  if(!qz) return;
  const q=QUIZ[qz.set][qz.order[qz.idx]];
  const btns=document.querySelectorAll("#quizBox .qbtn");
  if(!btns.length||btns[0].disabled) return;
  btns.forEach((b,j)=>{b.disabled=true;
    if(j===q.c){b.classList.add("ok");b.insertAdjacentText("beforeend"," ✓");}
    else if(j===i){b.classList.add("no");b.insertAdjacentText("beforeend"," ✗");}
  });
  if(i===q.c){qz.score++;if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(40);}
  const fb=document.getElementById("quizFb");
  if(fb) fb.innerHTML=(i===q.c?'<div class="oknote">✅ Richtig!</div>':`<div class="warn">Richtig wäre: ${q.a[q.c]}</div>`)+`<button class="btn sm" onclick="qz.idx++;renderQuiz()">Weiter →</button>`;
}

}
